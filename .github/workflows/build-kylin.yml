# 麒麟 V11 单文件二进制自动打包
#
# 触发：
#   1) 手动：GitHub → Actions → 本工作流 → Run workflow（产物在 run 页面 Artifacts 里下载）
#   2) 打 tag：git tag v1.0.0 && git push origin v1.0.0
#      → 自动打包并把 tar.gz 挂到该 tag 的 GitHub Release（附自动生成的 release notes）
#
# 打包流程完全复用本地脚本 scripts/build-bin-kylin.sh：
#   - 前端 npm run build 并同步到 frontend_dist（SYNC_FRONTEND=1，保证与源码一致）
#   - docker 内用 deploy/kylin-v11/Dockerfile.bin + PyInstaller 产单文件二进制
#   - CI 上没有自制的 kylin-server:v11 镜像，脚本自动回退 openeuler/openeuler:24.03-lts
#     （与麒麟 V11 同源：glibc 2.38 / Python 3.11，产物兼容性一致）
#
# 产物：icu-quality-dashboard-kylin-v11-x86_64-<版本>.tar.gz
#   内含 单文件二进制 + 校验和 + .env.template + README.md
#   <版本> = tag 名（tag 触发）或 r<run号>-<短commit>（手动触发）

name: 麒麟V11打包

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: build-kylin-${{ github.ref }}
  cancel-in-progress: true

env:
  # GitHub 托管 runner 在境外，官方 PyPI 比国内镜像快；想换回清华镜像改这里即可
  PIP_INDEX_URL: https://pypi.org/simple

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js（构建前端用）
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: icu-quality-dashboard/package-lock.json

      - name: 构建前端 + 麒麟单文件二进制
        # bash 显式调用：不依赖 git 可执行位（Windows 提交易丢 mode）
        run: SYNC_FRONTEND=1 bash ./scripts/build-bin-kylin.sh

      - name: 打发布包
        run: |
          set -euo pipefail
          ARCH="$(uname -m)"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VERSION="$GITHUB_REF_NAME"
          else
            VERSION="r${GITHUB_RUN_NUMBER}-$(git rev-parse --short HEAD)"
          fi
          PKG="icu-quality-dashboard-kylin-v11-${ARCH}-${VERSION}"
          STAGE="release/${PKG}"
          mkdir -p "$STAGE"
          cp dist-kylin/icu-quality-dashboard "$STAGE/"
          cp dist-kylin/icu-quality-dashboard.sha256 "$STAGE/"
          cp deploy/env.template "$STAGE/.env.template"
          cat > "$STAGE/README.md" <<'EOF'
          # ICU Quality Dashboard — 麒麟 V11 单文件包

          - `icu-quality-dashboard`：单文件二进制（后端 API + 前端静态资源已内置，零依赖）
          - `icu-quality-dashboard.sha256`：二进制校验和
          - `.env.template`：运行配置模板（MongoDB / LLM）

          ## 安装与运行

          ```bash
          sha256sum -c icu-quality-dashboard.sha256
          cp .env.template .env   # 填好 MongoDB / LLM 配置
          chmod +x icu-quality-dashboard
          ./icu-quality-dashboard
          ```

          浏览器打开 `http://SERVER_IP:8091`；健康检查：

          ```bash
          curl http://127.0.0.1:8091/api/departments
          ```

          不放 `.env` 也可直接用环境变量启动，例如：

          ```bash
          SMARTCARE_DB_HOST=10.0.0.5 PORT=8091 ./icu-quality-dashboard
          ```

          ## systemd（开机自启，可选）

          创建 `/etc/systemd/system/icu-quality-dashboard.service`：

          ```ini
          [Unit]
          Description=ICU Quality Dashboard
          After=network.target

          [Service]
          Type=simple
          WorkingDirectory=/opt/icu-quality-dashboard
          ExecStart=/opt/icu-quality-dashboard/icu-quality-dashboard
          Restart=always
          RestartSec=5

          [Install]
          WantedBy=multi-user.target
          ```

          然后：

          ```bash
          sudo mkdir -p /opt/icu-quality-dashboard
          sudo cp -a ./* /opt/icu-quality-dashboard/
          sudo systemctl daemon-reload
          sudo systemctl enable --now icu-quality-dashboard
          sudo systemctl status icu-quality-dashboard
          ```
          EOF
          tar -C release -czf "release/${PKG}.tar.gz" "$PKG"
          (cd release && sha256sum "${PKG}.tar.gz" > "${PKG}.tar.gz.sha256")
          echo "PKG_TARBALL=release/${PKG}.tar.gz" >> "$GITHUB_ENV"
          echo "PKG_SHA=release/${PKG}.tar.gz.sha256" >> "$GITHUB_ENV"
          ls -lh release/

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: icu-quality-dashboard-kylin-v11-${{ github.run_number }}
          path: |
            release/*.tar.gz
            release/*.tar.gz.sha256
          if-no-files-found: error

      - name: 挂到 GitHub Release（仅 tag 触发）
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="$GITHUB_REF_NAME"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$PKG_TARBALL" "$PKG_SHA" --clobber
          else
            gh release create "$TAG" "$PKG_TARBALL" "$PKG_SHA" \
              --title "$TAG" --generate-notes
          fi
